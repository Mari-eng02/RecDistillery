# Distillation Experts + Relaxed Ranking Distillation Configuration
strategy: DE_RRD
temperature: 0.1
lambda_de: 0.1
num_experts: 20
lambda_rrd: 0.1
rrd:
  interesting_size: 40
  uninteresting_size: 50
  temperature: 1.0
  teacher_topk: 500

bayesian:
  search_space:
    distillation.lambda_de:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    distillation.num_experts:
      type: categorical
      choices: [10, 20, 30]
    distillation.temperature:
      type: categorical
      choices: [0.01, 0.1, 0.5]
    distillation.lambda_rrd:
      type: float
      low: 0.00001
      high: 1
      log: true
    distillation.interesting_size:
      type: categorical
      choices: [10, 20, 30, 40, 50]
    distillation.uninteresting_size:
      type: categorical
      choices: [10, 20, 30, 40, 50]
