# Template for RecDistill Student Training with FTD
train_student:
  dataset: null

  teacher:
    framework: null
    model: null
    embedding_dim: 200
    path: null
    noise:
      scale: 0.0
      target: both
      seed: null

  student:
    framework: null
    backbone: null
    model: FTD
    embedding_dim: 20

  optimization:
    epochs: 100
    batch_size: 2048
    learning_rate: 0.001
    l2_reg: 0.0001
    validation_rate: 10
    validation_metric: ndcg@20
    grid_search:
      enabled: false
    optuna:
      enabled: false

  distillation:
    strategy: FTD
    topology:
      type: FTD
      lambda_td: 0.001
      entity_sample_size: 256

  runtime:
    seed: 42
    device: null
    num_workers: 4
    output_path: null
    save_every: 0
    wandb:
      enabled: false
    extra_args: []

  evaluation:
    enabled: true
    k: 20
    every: 5
    batch_size: 256
    val_only: false
    selection_split: val
    selection_metric: ndcg
    assert_no_train_leak: true

  early_stopping:
    enabled: true
    mode: val_metric
    metric: ndcg
    patience: 10
    min_delta: 0.0
