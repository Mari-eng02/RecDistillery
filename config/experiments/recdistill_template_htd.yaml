# Template for RecDistill Student Training with HTD
train_student:
  dataset: null  # Will be filled by composer
  
  teacher:
    framework: null
    model: null  # Will be filled by composer
    embedding_dim: 200
    path: null
    noise:
      scale: 0.0
      target: both
      seed: null
  
  student:
    framework: null
    backbone: null  # Will be filled by composer
    model: HTD
    embedding_dim: 20
    temperature: 1.0
  
  optimization:
    epochs: 100
    batch_size: 2048
    learning_rate: 0.001
    l2_reg: 0.0001
    validation_rate: 10
    validation_metric: ndcg@20
  
  distillation:
    strategy: HTD
    temperature: 3.0
    lambda_kl: 0.5
    topology:
      type: HTD
      lambda_td: 0.001
      alpha: 0.5
      num_groups: 40
      topology_mode: group_pe
      initial_tau: 1.0
      min_tau: 1e-10
      decay_epochs: 100
      entity_sample_size: 256
  
  runtime:
    seed: 42
    device: null
    num_workers: 4
    output_path: results/recdistill/htd/citeulike/
    save_every: 0
    wandb:
      enabled: false
  
  evaluation:
    enabled: true
    k: 20
    every: 5
    batch_size: 256
    val_only: false
    selection_split: val
    selection_metric: ndcg
    assert_no_train_leak: true
  
  early_stopping:
    enabled: true
    mode: val_metric
    metric: ndcg
    patience: 10
    min_delta: 0.0
