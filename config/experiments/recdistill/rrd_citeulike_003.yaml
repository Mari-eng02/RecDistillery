experiment:
  id: '003'
  name: rrd_citeulike
  kind: recdistill
distill_student:
  dataset: citeulike
  teacher:
    default: teacher/recbole/sgl.yaml
    path: null
  student:
    default: student/recbole/sgl.yaml
  optimization:
    default: optimization/default.yaml
    batch_size: 4096
    bayesian:
      enabled: true
    early_stopping:
      enabled: true
  distillation:
    strategy: RRD
    default: distillation/rrd.yaml
  runtime:
    default: runtime/default.yaml
    num_workers: 4
  evaluation:
    default: evaluation/default.yaml
    batch_size: 1024
