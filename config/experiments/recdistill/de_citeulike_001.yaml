experiment:
  id: '001'
  name: de_citeulike
  kind: recdistill
distill_student:
  dataset: citeulike
  teacher:
    default: teacher/elliot/lgcn.yaml
    path: null
  student:
    default: student/elliot/lgcn.yaml
  optimization:
    default: optimization/default.yaml
    batch_size: 2048
    bayesian:
      enabled: true
    early_stopping:
      enabled: true
  distillation:
    strategy: DE
    default: distillation/de.yaml
  runtime:
    default: runtime/default.yaml
    num_workers: 4
  evaluation:
    default: evaluation/default.yaml
    batch_size: 1024
