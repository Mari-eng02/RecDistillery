# Template for RecDistill Student Training with UnKD
train_student:
  dataset: null  # Will be filled by composer
  
  teacher:
    framework: null
    model: null  # Will be filled by composer
    embedding_dim: 200
    path: null
  
  student:
    framework: null
    backbone: null  # Will be filled by composer
    model: UnKD
    embedding_dim: 20
  
  optimization:
    epochs: 10
    batch_size: 2048
    learning_rate: 0.001
    l2_reg: 0.0001
    validation_rate: 10
    validation_metric: ndcg@20
  
  distillation:
    strategy: UnKD
    lambda_unkd: 0.1
    unkd:
      sample_num: 30
      group_count: 9
      popularity_lambda: 0.181357308677834
      rank_top_k: 1000
      rank_temperature: 20.0
  
  runtime:
    seed: 42
    device: null
    num_workers: 4
    output_path: null
    save_every: 0
    wandb:
      enabled: false
  
  evaluation:
    enabled: true
    k: 20
    every: 5
    batch_size: 256
    val_only: false
    selection_split: val
    selection_metric: ndcg
    assert_no_train_leak: true
  
  early_stopping:
    enabled: true
    mode: val_metric
    metric: ndcg
    patience: 10
    min_delta: 0.0
