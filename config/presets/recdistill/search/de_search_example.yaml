train_student:
  dataset: bookcrossing

  teacher:
    model: NMF
    embedding_dim: 200
    path: null
    framework: recbole
    format: auto
    adapter: null
    user_embeddings_path: null
    item_embeddings_path: null
    score_matrix_path: null
    topk_items_path: null
    topk_scores_path: null

  student:
    framework: recbole
    backbone: LGCN
    embedding_dim: 20

  optimization:
    epochs: 300
    batch_size: 2048
    grid_search:
      enabled: false
      fail_fast: false
      output_dir: null
      parameters:
        distillation.lambda_de: [0.5, 1.0]
        distillation.temperature: [0.5, 1.0]
        optimization.learning_rate: [0.001, 0.0005]
    optuna:
      enabled: true
      n_trials: 30
      seed: 42
      study_name: optuna_bookcrossing_lgcn_ndcg_logspace_v1
      storage: sqlite:///optuna_studies.db
      metric: ndcg
      search_space:
        optimization.learning_rate:
          type: float
          low: 0.0001
          high: 0.01
          log: true
        optimization.l2_reg:
          type: float
          low: 0.0001
          high: 0.01
          log: true
        distillation.lambda_de:
          type: float
          low: 0.0001
          high: 0.1
          log: true
        distillation.num_experts:
          type: categorical
          choices: [10, 20, 30]
        distillation.temperature:
          type: categorical
          choices: [0.01, 0.1, 0.5]
      output_dir: null
      timeout_sec: null
      rerun_best_on_test: false
      test_seeds: "42"
      keep_training_wandb: true
      wandb:
        enabled: true
        project: repro_distill
        entity: alberto-mancino-politecnico-di-bari
        group: optuna/de/bookcrossing/lgcn


  distillation:
    strategy: DE
    temperature: 0.1
    lambda_kl: 0.5
    lambda_de: 0.1
    num_experts: 20

  runtime:
    seed: 42
    device: null
    num_workers: 4
    output_path: results/recdistill/de/recbole/NMF/recbole/LGCN/bookcrossing/best/wei/recbole_NMF_recbole_LGCN_bookcrossing_20_best.distilled_student
    save_every: 0
    gpu: 0
    backend: pytorch
    wandb:
      enabled: false
    extra_args: []

  evaluation:
    enabled: true
    k: 20
    every: 5
    batch_size: 256
    simple_metrics:
    - nDCGRendle2020
    - Recall
    - Precision
    - HR
    val_only: true
    selection_split: val
    selection_metric: ndcg
    assert_no_train_leak: true

  early_stopping:
    enabled: true
    mode: val_metric
    metric: ndcg
    patience: 8
    min_delta: 0.0
    warmup: 30
    restore_best: true
