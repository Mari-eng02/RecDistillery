train_student:
  dataset: amazon_cd

  teacher:
    model: LGCN
    embedding_dim: 200
    path: null
    framework: lenskit
    format: auto
    adapter: null
    user_embeddings_path: null
    item_embeddings_path: null
    score_matrix_path: null
    topk_items_path: null
    topk_scores_path: null

  student:
    framework: lenskit
    backbone: LGCN
    model: FTD
    embedding_dim: 20

  optimization:
    epochs: 300
    batch_size: 2048
    grid_search:
      enabled: false
    optuna:
      enabled: true
      n_trials: 30
      seed: 42
      study_name: optuna_amazon_cd_LGCN_ftd_ndcg_v1
      storage: sqlite:///optuna_studies.db
      metric: ndcg
      search_space:
        optimization.learning_rate:
          type: float
          low: 0.0001
          high: 0.01
          log: true
        optimization.l2_reg:
          type: float
          low: 0.000001
          high: 0.001
          log: true
        distillation.topology.lambda_td:
          type: float
          low: 0.00001
          high: 1
          log: true
        distillation.topology.entity_sample_size:
          type: categorical
          choices: [128, 256, 512]
      output_dir: null
      timeout_sec: null
      rerun_best_on_test: false
      test_seeds: "42"
      keep_training_wandb: true
      wandb:
        enabled: false
        project: repro_distill
        entity: alberto-mancino-politecnico-di-bari
        group: optuna/ftd/amazon_cd/LGCN

  distillation:
    strategy: FTD
    topology:
      type: FTD
      lambda_td: 0.001
      entity_sample_size: 256

  runtime:
    seed: 42
    device: null
    num_workers: 4
    output_path: results/recdistill/ftd/lenskit/LGCN/lenskit/LGCN/amazon_cd/best/wei/lenskit_LGCN_lenskit_LGCN_amazon_cd_20_best.distilled_student
    save_every: 0
    extra_args: []

  evaluation:
    enabled: true
    k: 20
    every: 5
    batch_size: 1024
    simple_metrics:
    - nDCGRendle2020
    - Recall
    - Precision
    - HR
    val_only: true
    selection_split: val
    selection_metric: ndcg
    assert_no_train_leak: true

  early_stopping:
    enabled: true
    mode: val_metric
    metric: ndcg
    patience: 8
    min_delta: 0.0
    warmup: 30
    restore_best: true
